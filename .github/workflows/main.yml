
name: Build AVENTURY APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q AVENTURY_PROJETO_ANDROID_GITHUB.zip -d projeto
          FILE=$(find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: AVENTURY-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
